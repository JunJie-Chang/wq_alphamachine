[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphamachine"
dynamic = ["version"]
description = "A diversity-first alpha research pipeline for WorldQuant BRAIN."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
alphamachine = "alphamachine.cli:main"

[tool.setuptools.dynamic]
version = { attr = "alphamachine.__version__" }

[tool.setuptools.packages.find]
include = ["alphamachine*"]
